[project]
name = "windcloud"
version = "0.1.0"
description = "windcloud"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[aiohttp] (>=2.5.0)",
    "nonebot-adapter-qq (>=1.7.2)",
    "nonebot-plugin-alconna (>=0.62.1)",
    "pyspellchecker (==0.8.4)",
]

[tool.poetry]
package-mode = false

[project.optional-dependencies]
dev = [
    
]

[tool.nonebot]
plugin_dirs = ["windcloud/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-qq = [
    { name = "QQ", module_name = "nonebot.adapters.qq" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-alconna = ["nonebot_plugin_alconna"]

